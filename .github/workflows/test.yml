name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: test app
        run: go test ./src/app/... -v -count=1

      - name: build app
        run: go build -o /dev/null ./src/app/cmd/server

      - name: build infra
        working-directory: src/infra
        run: go build -o /dev/null .
