version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: saturday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /src/infra
    schedule:
      interval: weekly
      day: saturday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5
